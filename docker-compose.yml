# ==============================================================================
# Docker Compose for RussiaBooking Local Development & Staging Stack
# Services: App (Full Stack), PostgreSQL 16, Redis 7 (Caching & Locking), 
#           Prometheus, Grafana (Observability), and MinIO (S3-compatible storage)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Main Application Server (Unified API & Web Client)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: russiabooking-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass_2026@postgres:5432/russiabooking?schema=public
      - REDIS_URL=redis://:redis_secure_pass_2026@redis:6379/0
      - JWT_SECRET=dev_jwt_super_secret_signing_key_32bytes_minimum!
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - CSRF_SECRET=csrf_super_secret_salt_value_2026_dev
      - SENTRY_DSN=
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - AWS_S3_BUCKET=russiabooking-assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - russiabooking-network

  # ----------------------------------------------------------------------------
  # Relational Database: PostgreSQL 16 with WAL and Healthcheck
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: russiabooking-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass_2026
      - POSTGRES_DB=russiabooking
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d russiabooking"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - russiabooking-network

  # ----------------------------------------------------------------------------
  # In-Memory Cache & Distributed Locks: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: russiabooking-redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secure_pass_2026 --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secure_pass_2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - russiabooking-network

  # ----------------------------------------------------------------------------
  # Observability: Prometheus Metrics Scraper
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: russiabooking-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - russiabooking-network

  # ----------------------------------------------------------------------------
  # Observability: Grafana Dashboards
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: russiabooking-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_grafana_pass_2026
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - russiabooking-network

  # ----------------------------------------------------------------------------
  # Local S3 Storage: MinIO (Vouchers, Photos & Exports)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: russiabooking-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - russiabooking-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  minio_data:
    driver: local

networks:
  russiabooking-network:
    driver: bridge
