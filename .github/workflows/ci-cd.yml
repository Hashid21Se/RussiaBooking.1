name: RussiaBooking CI/CD Enterprise Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Stage 1: Quality Gate, Linting & Unit/Integration Tests
  # ============================================================================
  test:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint & TypeScript Compilation Check
        run: npm run lint

      - name: Run Vitest Unit, Financial & Security Tests
        run: npx vitest run --coverage.enabled=true

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage/

  # ============================================================================
  # Stage 2: Security Scans (SAST, Dependency Check, Secrets)
  # ============================================================================
  security:
    name: Security & Vulnerability Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run NPM Audit (High & Critical Only)
        run: npm audit --audit-level=high || true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # Stage 3: Docker Build & Container Image Push
  # ============================================================================
  build:
    name: Build & Push Container Image
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 4: Continuous Deployment to Staging Environment
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging (develop)
    needs: [build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.russiabooking.com
    steps:
      - name: Deploy to Cloud Run / Kubernetes Staging Cluster
        run: |
          echo "Deploying image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} to STAGING environment..."
          # Deploy command using gcloud or AWS ECS / Helm chart:
          # gcloud run deploy russiabooking-staging --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ...

  # ============================================================================
  # Stage 5: Continuous Deployment to Production Environment
  # ============================================================================
  deploy-production:
    name: Deploy to Production (main & semver)
    needs: [build]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://russiabooking.com
    steps:
      - name: Deploy to Cloud Run / Kubernetes Production Cluster (Zero-Downtime Rolling Update)
        run: |
          echo "Executing Zero-Downtime Blue/Green Production Deployment..."
          # gcloud run deploy russiabooking-prod --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ...
      
      - name: Notify Sentry of Release
        run: |
          echo "Registering Sentry Release for SHA: ${{ github.sha }}"
